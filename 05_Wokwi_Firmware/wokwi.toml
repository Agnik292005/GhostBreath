# Wokwi project configuration — GhostBreath Module 5 (v2 OLED edition)
# This file tells Wokwi which Arduino libraries to install before compiling.
# Drop this file alongside ghostbreath.ino and diagram.json in your Wokwi project.

[wokwi]
version = 1

# Adafruit SSD1306 OLED driver (I2C, 128x64)
[[libraries]]
name = "Adafruit SSD1306"
version = "*"

# Adafruit GFX core graphics library (required by SSD1306)
[[libraries]]
name = "Adafruit GFX Library"
version = "*"
